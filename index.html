<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout ePayco - Prueba Técnica Soporte</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Estilos  -->
  <link rel="stylesheet" href="Css/style.css" />

  <!-- Script oficial del Checkout de ePayco -->
  <script type="text/javascript" src="https://checkout.epayco.co/checkout.js"></script>
</head>

<body class="checkout-body">
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">
        <div class="card checkout-card shadow-sm border-0">
          <!-- Encabezado -->
          <div class="card-header checkout-header text-white p-4">
            <div class="d-flex align-items-center justify-content-between gap-2">
              <div>
                <h1 class="h4 mb-1 fw-bold">
                  <i class="fa-solid fa-bag-shopping me-2"></i>Checkout ePayco
                </h1>
                <p class="mb-0 small text-white-50">
                  Selección de producto e integración JavaScript (Entorno de Pruebas)
                </p>
              </div>
              <span class="badge badge-sandbox px-3 py-2">
                <i class="fa-solid fa-flask me-1"></i>Sandbox
              </span>
            </div>
          </div>

          <!-- Cuerpo principal -->
          <div class="card-body p-3 p-sm-4 p-md-5">
            <!-- Selección del producto -->
            <div class="mb-4">
              <label for="productoSelect" class="form-label fw-semibold">
                <i class="fa-solid fa-box-open me-1 text-primary"></i>Selecciona un producto
              </label>
              <select id="productoSelect" class="form-select form-select-lg">
                <option value="0">Plan Cloud Básico — $50.000 COP + IVA</option>
                <option value="1">Licencia Software Empresarial — $120.000 COP + IVA</option>
                <option value="2">Consultoría Técnica Especializada — $250.000 COP + IVA</option>
              </select>
            </div>

            <!-- Ficha detallada del producto -->
            <section id="detalleProducto" class="product-box p-3 p-sm-4 mb-4 rounded-3">
              <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start gap-2 mb-2">
                <div>
                  <span class="badge bg-primary-subtle text-primary mb-2" id="prodCategoria"></span>
                  <h2 class="h5 fw-bold mb-1" id="prodNombre"></h2>
                </div>
                <div class="text-sm-end">
                  <small class="text-muted d-block">Total a pagar</small>
                  <span class="fs-4 fw-bold text-primary">$<span id="prodTotal"></span> COP</span>
                </div>
              </div>

              <p class="text-muted small mb-3" id="prodDescripcion"></p>

              <hr class="my-3" />

              <div class="row g-2 small">
                <div class="col-6">
                  <span class="text-muted">Valor base:</span>
                  <strong class="d-block">$<span id="prodBase"></span> COP</strong>
                </div>
                <div class="col-6 text-end">
                  <span class="text-muted">IVA (19%):</span>
                  <strong class="d-block">$<span id="prodIva"></span> COP</strong>
                </div>
              </div>
            </section>

            <!-- Datos del usuario pagador -->
            <h3 class="h6 fw-bold mb-3">
              <i class="fa-solid fa-user-check me-1 text-primary"></i>Datos del pagador
            </h3>

            <div class="row g-3 mb-4">
              <div class="col-12 col-sm-6">
                <label for="clienteNombre" class="form-label small fw-semibold">Nombre completo</label>
                <input type="text" id="clienteNombre" class="form-control" value="Juan Pérez" required />
              </div>

              <div class="col-12 col-sm-6">
                <label for="clienteEmail" class="form-label small fw-semibold">Correo electrónico</label>
                <input type="email" id="clienteEmail" class="form-control" value="juan.perez@ejemplo.com" required />
              </div>

              <div class="col-12 col-sm-4">
                <label for="clienteTipoDoc" class="form-label small fw-semibold">Tipo de documento</label>
                <select id="clienteTipoDoc" class="form-select">
                  <option value="CC" selected>CC</option>
                  <option value="CE">CE</option>
                  <option value="NIT">NIT</option>
                </select>
              </div>

              <div class="col-12 col-sm-4">
                <label for="clienteDoc" class="form-label small fw-semibold">Número de documento</label>
                <input type="text" id="clienteDoc" class="form-control" value="1012345678" required />
              </div>

              <div class="col-12 col-sm-4">
                <label for="clienteTelefono" class="form-label small fw-semibold">Teléfono / Celular</label>
                <input type="text" id="clienteTelefono" class="form-control" value="3001234567" required />
              </div>
            </div>

            <!-- Botón de pago -->
            <div class="d-grid">
              <button type="button" id="btnPagarEpayco" class="btn btn-pay btn-lg py-3 fw-semibold">
                <i class="fa-solid fa-lock me-2"></i>Pagar con ePayco
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica interactiva y Checkout ePayco -->
  <script src="js/script.js"></script>
</body>

</html>
